<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Administrativo — Teresópolis Parques</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 36L16 14L24 26L30 16L44 36H4Z" stroke="#dfe8de" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="35" cy="11" r="3.2" fill="#b8933d"/>
      </svg>
      <span class="logo-text"><strong>Teresópolis</strong><span>RJ · BRASIL</span></span>
    </a>
    <nav class="admin-nav" id="admin-nav">
      <a href="#dashboard" data-view="dashboard" class="is-active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <a href="#parques" data-view="parques">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20l6-16 4 10 3-6 5 12"/></svg>
        Parques
      </a>
      <a href="#horarios" data-view="horarios">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
        Horários
      </a>
      <a href="#eventos" data-view="eventos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
        Eventos
      </a>
      <div class="nav-divider"></div>
      <a href="#midia" data-view="midia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="m21 15-5-5-9 9"/></svg>
        Mídia
      </a>
      <a href="#usuarios" data-view="usuarios">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg>
        Usuários
      </a>
      <a href="#configuracoes" data-view="configuracoes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg>
        Configurações
      </a>
    </nav>
    <div class="admin-logout">
      <button id="logout-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sair
      </button>
    </div>
  </aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <div></div>
      <div class="admin-user">
        <span>Olá, Administrador</span>
        <span class="admin-avatar">A</span>
      </div>
    </div>
    <div class="admin-content" id="admin-content">
      <!-- preenchido via JavaScript -->
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-card" id="modal-card"></div>
</div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
