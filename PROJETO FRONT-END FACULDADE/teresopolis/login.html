<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área Administrativa — Teresópolis Parques</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .login-page { --login-bg: url('https://images.unsplash.com/photo-1755371033904-21dd8a9d002b?w=1600&h=1000&fit=crop&q=70&auto=format'); }
</style>
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 36L16 14L24 26L30 16L44 36H4Z" stroke="#1c4c38" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="35" cy="11" r="3.2" fill="#b8933d"/>
      </svg>
      <span class="logo-text"><strong>Teresópolis</strong><span>RJ · BRASIL</span></span>
    </a>
    <h1>Área Administrativa</h1>
    <p>Faça login para acessar o painel de gerenciamento dos parques.</p>

    <div class="login-error" id="login-error">Usuário ou senha incorretos. Tente novamente.</div>

    <form id="login-form">
      <div class="field">
        <label for="user">Usuário</label>
        <div class="field-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg>
          <input type="text" id="user" autocomplete="username" required placeholder="usuario">
        </div>
      </div>
      <div class="field">
        <label for="pass">Senha</label>
        <div class="field-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" id="pass" autocomplete="current-password" required placeholder="••••••••">
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>

    <div class="login-links"><a href="#" id="forgot-link">Esqueci minha senha</a></div>
    <p class="login-hint">Demonstração (MVP): usuário <strong>admin</strong> · senha <strong>teresopolis2026</strong></p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  if (isLoggedIn()) window.location.href = 'admin.html';

  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const user = document.getElementById('user').value.trim();
    const pass = document.getElementById('pass').value;
    const errorBox = document.getElementById('login-error');
    if (login(user, pass)) {
      window.location.href = 'admin.html';
    } else {
      errorBox.classList.add('is-visible');
    }
  });

  document.getElementById('forgot-link').addEventListener('click', (e) => {
    e.preventDefault();
    alert('Em um sistema real, um e-mail de redefinição seria enviado. Use as credenciais de demonstração exibidas nesta página.');
  });
</script>
</body>
</html>
