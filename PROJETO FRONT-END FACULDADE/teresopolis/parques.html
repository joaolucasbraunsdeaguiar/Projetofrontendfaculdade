<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parques — Teresópolis Parques</title>
<meta name="description" content="Conheça os três parques naturais de Teresópolis: Serra dos Órgãos, Três Picos e Montanhas de Teresópolis.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 36L16 14L24 26L30 16L44 36H4Z" stroke="#1c4c38" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="35" cy="11" r="3.2" fill="#b8933d"/>
      </svg>
      <span class="logo-text"><strong>Teresópolis</strong><span>RJ · BRASIL</span></span>
    </a>
    <nav class="main-nav" id="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="parques.html" aria-current="page">Parques</a></li>
        <li><a href="contatos.html">Contatos</a></li>
      </ul>
    </nav>
    <button class="nav-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="main-nav">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="page-hero" style="--page-hero-img: url('https://images.unsplash.com/photo-1558180348-506ab49a5912?w=1600&h=500&fit=crop&q=70&auto=format');">
    <div class="container">
      <span class="eyebrow">Unidades de conservação</span>
      <h1>Nossos Parques</h1>
      <p>Conheça cada um dos parques e planeje sua visita: horários, trilhas e eventos em um só lugar.</p>
    </div>
  </section>

  <section class="section list-row">
    <div class="container">
      <div id="park-list" style="display:flex; flex-direction:column; gap:24px;"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>Teresópolis - RJ - Brasil</p>
    <div class="footer-social">
      <a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="17.2" cy="6.8" r="0.6" fill="currentColor" stroke="none"/></svg></a>
      <a href="#" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h-2a5 5 0 0 0-5 5v2H6v4h2v7h4v-7h3l1-4h-4V8a1 1 0 0 1 1-1h3z"/></svg></a>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  const parks = getParks();
  const list = document.getElementById('park-list');
  list.innerHTML = parks.map((park) => `
    <article class="park-card">
      <div class="park-card-media">
        <span class="status-pill ${park.status === 'aberto' ? 'is-open' : 'is-closed'}">${park.status === 'aberto' ? 'Aberto' : 'Fechado'}</span>
        <img src="${park.cardImage}" alt="${park.name}" loading="lazy">
      </div>
      <div class="park-card-body">
        <h3>${park.name}</h3>
        <p>${park.short}</p>
        <a class="btn btn-outline btn-sm" href="parque.html?id=${park.id}">Ver detalhes</a>
      </div>
    </article>
  `).join('');
</script>
</body>
</html>
